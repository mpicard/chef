[project]
name = "agentic-harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
    "sentence-transformers>=5.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat modules live in src/; editable install puts that dir on sys.path.
[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "nest-asyncio>=1.6.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "test"]
